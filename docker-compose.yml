version: '3.8'

services:
  db:
    image: postgres:15
    container_name: depeg_postgres
    environment:
      POSTGRES_USER: depeg_user
      POSTGRES_PASSWORD: depeg_pass
      POSTGRES_DB: depeg_monitor
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: